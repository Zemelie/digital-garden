<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamcham’s Place</title>
  <meta name="description" content="A digital garden of seeds, branches and the threads between them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,300..900;1,300..900&family=Chivo+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/hydrophilia-iced.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="assets/css/garden.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body class="page-home">
  <div class="shell">
    <section class="frame home-frame">
      <header class="topbar">
        <a class="fish" href="admin/" aria-label="Tend the garden" data-icon="fish"></a>
        <a class="place-name" href="./">Chamcham’s Place</a>
        <p class="tended" id="lastTended"></p>
      </header>

      <div class="stage" id="stage">
        <div class="stage-scroll">
          <div class="stage-canvas">
            <canvas class="sky" id="sky" aria-hidden="true"></canvas>
            <svg id="garden" role="img" aria-labelledby="gardenDesc" preserveAspectRatio="xMidYMax meet">
              <desc id="gardenDesc">Dandelions, one per idea. Each dot around a seed head is an entry that grows from it.</desc>
            </svg>
          </div>
        </div>

        <div class="garden-title">
          <h1>The Garden</h1>
          <form class="filters" id="filters" aria-label="Filter the garden">
            <label class="f-node"><span>Node</span><select name="node"></select></label>
            <label class="f-status"><span>Status</span><select name="status"></select></label>
            <label class="f-type"><span>Type</span><select name="tag"></select></label>
            <button type="submit" class="go">Go!</button>
          </form>
          <p class="filter-note" id="filterNote" aria-live="polite"></p>
        </div>

        <div class="tooltip" id="tooltip" hidden></div>
      </div>
    </section>

    <footer class="clockbar">
      <p class="clock" data-clock></p>
      <a class="index-link" href="garden-index.html">Index</a>
    </footer>
  </div>

  <script type="module" src="assets/js/home.js"></script>
</body>
</html>
