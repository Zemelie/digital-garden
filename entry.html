<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry · Chamcham’s Place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,300..900;1,300..900&family=Chivo+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/hydrophilia-iced.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="assets/css/garden.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="page-entry">
  <div class="shell">
    <section class="frame">
      <header class="topbar">
        <a class="fish" href="plant/" aria-label="Plant a seed" data-icon="fish"></a>
        <a class="place-name" href="./">Chamcham’s Place</a>
        <p class="tended" id="lastTended"></p>
      </header>

      <div class="entry-stage" id="entryStage">
        <div class="entry-side left">
          <section class="card viewer" aria-labelledby="viewerTitle">
            <h2 class="card-head" id="viewerTitle">Dandelion viewer:<strong id="viewerNode"></strong></h2>
            <div class="viewer-body">
              <svg id="viewer" viewBox="-140 -135 280 290" role="img" aria-label="Where this entry sits in its dandelion"></svg>
              <div class="connected" id="connected"></div>
            </div>
          </section>
        </div>

        <article class="entry-panel">
          <nav class="breadcrumb" id="crumbs" aria-label="Where you are"></nav>
          <div class="entry-scroll pill-scroll" tabindex="0">
            <h1 id="title">Loading…</h1>
            <dl class="meta">
              <div><dt>Epistemic status</dt><dd id="stage"></dd></div>
              <div><dt>Last tended</dt><dd id="tended"></dd></div>
              <div><dt>Date planted</dt><dd id="planted"></dd></div>
              <div><dt>Type</dt><dd id="kind"></dd></div>
            </dl>
            <div class="media" id="media"></div>
            <div class="prose" id="body"></div>
          </div>
        </article>

        <div class="entry-side right">
          <section class="card comments" aria-labelledby="commentsTitle">
            <h2 class="card-head" id="commentsTitle">Comments</h2>
            <div class="comments-body" id="commentsBody"></div>
          </section>
        </div>
      </div>
    </section>

    <footer class="clockbar has-nav">
      <p class="clock" data-clock></p>
      <nav class="entry-nav" aria-label="Move through the garden">
        <a id="prevNode" class="cluster"><img src="assets/img/icons/go-node.svg" alt="" aria-hidden="true"><span>Node</span></a>
        <a id="prevBranch"><img src="assets/img/icons/go-branch.svg" alt="" aria-hidden="true"><span>Branch</span></a>
        <a id="home" href="./" class="home-dot" aria-label="Back to the garden"></a>
        <a id="nextBranch"><span>Branch</span><img src="assets/img/icons/go-branch.svg" alt="" aria-hidden="true" class="flip"></a>
        <a id="nextNode" class="cluster"><span>Node</span><img src="assets/img/icons/go-node.svg" alt="" aria-hidden="true" class="flip"></a>
      </nav>
      <a class="index-link" href="garden-index.html">Index</a>
    </footer>
  </div>

  <script type="module" src="assets/js/entry.js"></script>
</body>
</html>
