# Decap CMS settings — the "plant a seed" form at /admin.
# Every save commits a JSON file to content/entries/ in your GitHub repo;
# Netlify then rebuilds the site and the dandelions regrow.

backend:
  name: github
  repo: Zemelie/digital-garden
  branch: main
  commit_messages:
    create: "Plant {{collection}} “{{slug}}”"
    update: "Tend {{collection}} “{{slug}}”"
    delete: "Compost {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Uncomment to edit locally without GitHub (needs Node: run `npx decap-server`).
# local_backend: true

site_url: /
display_url: /
logo_url: /assets/img/favicon.svg

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: entries
    label: Garden
    label_singular: Entry
    description: "Nodes are ideas (each becomes a dandelion). Branches are connected thoughts, assets, files and links that grow from a node or from another branch."
    folder: content/entries
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{type}} · {{status}}"
    sortable_fields: [title, planted, tended, type, status]
    view_filters:
      - { label: Nodes, field: type, pattern: node }
      - { label: Branches, field: type, pattern: branch }
      - { label: Fresh, field: status, pattern: fresh }
      - { label: Budding, field: status, pattern: budding }
      - { label: Bloomed, field: status, pattern: bloomed }
    view_groups:
      - { label: Type, field: type }
      - { label: Stage, field: status }
    fields:
      - { label: Title, name: title, widget: string }

      - label: Type
        name: type
        widget: select
        default: branch
        options:
          - { label: "Node — a new idea (a new dandelion)", value: node }
          - { label: "Branch — grows from a node or branch", value: branch }

      - label: Connected to
        name: parent
        widget: relation
        collection: entries
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Branches only: the node or branch this grows from. Leave empty for nodes."

      - label: Stage (epistemic status)
        name: status
        widget: select
        default: fresh
        options:
          - { label: "Fresh — just planted", value: fresh }
          - { label: "Budding — taking shape", value: budding }
          - { label: "Bloomed — fully grown", value: bloomed }

      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options: [document, link, photo, drawing, video, audio]

      - label: Date planted
        name: planted
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"

      - label: Last tended
        name: tended
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
        hint: "Bump this whenever you come back and tend the entry."

      - { label: Image, name: image, widget: image, required: false, choose_url: true }
      - { label: Link, name: link, widget: string, required: false, hint: "A URL this entry points to (article, video, tweet, website)." }

      - label: Files
        name: attachments
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "Documents, .otf files, audio or video. Audio and video play inline."
        fields:
          - { label: Label, name: label, widget: string }
          - { label: File, name: file, widget: file }

      - label: Threads to (related entries)
        name: related
        widget: relation
        collection: entries
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Connect this to entries in other clusters — drawn as threads across the garden."

      - { label: Notes, name: body, widget: markdown, required: false }
