# Decap CMS settings — the form behind the fish.
# Every save commits a JSON file to content/entries/ in GitHub;
# Netlify then rebuilds the site and the dandelions regrow.

backend:
  name: github
  repo: Zemelie/digital-garden
  branch: main
  commit_messages:
    create: "Plant “{{slug}}”"
    update: "Tend “{{slug}}”"
    delete: "Compost “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: /
display_url: /
logo_url: /assets/img/favicon.svg

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: entries
    label: Garden
    label_singular: Entry
    description: "Leave “Grows from” empty to plant a new dandelion (a node). Pick a node or branch to grow a branch from it."
    folder: content/entries
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{status}}"
    sortable_fields: [title, planted, tended, status]
    view_filters:
      - { label: Fresh, field: status, pattern: fresh }
      - { label: Budding, field: status, pattern: budding }
      - { label: Bloomed, field: status, pattern: bloomed }
    view_groups:
      - { label: Stage, field: status }
    fields:
      - { label: Title, name: title, widget: string }

      # Custom two-step picker (admin/garden-picker.js): dandelion first, then an optional branch.
      - label: Grows from
        name: parent
        widget: garden-parent
        required: false

      - label: Type
        name: tags
        widget: select
        multiple: true
        required: false
        options: [document, link, photo, drawing, video, audio]
        hint: "Anything you upload below is added automatically."

      - label: Stage
        name: status
        widget: select
        default: fresh
        options:
          - { label: "Fresh — freshly planted", value: fresh }
          - { label: "Budding — a budding idea", value: budding }
          - { label: "Blooming — fully bloomed", value: bloomed }

      # Set automatically when you save (see admin/index.html).
      - { label: Date planted, name: planted, widget: hidden }
      - { label: Last tended, name: tended, widget: hidden }

      - label: Files
        name: files
        widget: list
        required: false
        label_singular: file
        hint: "Pick what kind of thing you're adding, then upload it."
        types:
          - label: Photo
            name: photo
            widget: object
            summary: "📷 {{fields.label}}"
            fields:
              - { label: Photo, name: file, widget: image }
              - { label: Caption, name: label, widget: string, required: false }
          - label: Drawing
            name: drawing
            widget: object
            summary: "✏️ {{fields.label}}"
            fields:
              - { label: Drawing, name: file, widget: image }
              - { label: Caption, name: label, widget: string, required: false }
          - label: Document
            name: document
            widget: object
            summary: "📄 {{fields.label}}"
            fields:
              - { label: File, name: file, widget: file, hint: "PDF, .otf, notes, anything." }
              - { label: Name, name: label, widget: string, required: false }
          - label: Audio
            name: audio
            widget: object
            summary: "🎧 {{fields.label}}"
            fields:
              - { label: Audio file, name: file, widget: file, hint: "mp3, m4a or wav — plays on the page." }
              - { label: Name, name: label, widget: string, required: false }
          - label: Video
            name: video
            widget: object
            summary: "🎞 {{fields.label}}"
            fields:
              - { label: Video file, name: file, widget: file, required: false, hint: "Upload an mp4…" }
              - { label: Or a link, name: url, widget: string, required: false, hint: "…or paste a YouTube / Vimeo link." }
              - { label: Name, name: label, widget: string, required: false }
          - label: Link
            name: link
            widget: object
            summary: "🔗 {{fields.label}}"
            fields:
              - { label: URL, name: url, widget: string }
              - { label: Name, name: label, widget: string, required: false }

      - { label: Notes, name: body, widget: markdown, required: false }

      - label: Threads to
        name: related
        widget: relation
        collection: entries
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Optional: related entries in other dandelions."
